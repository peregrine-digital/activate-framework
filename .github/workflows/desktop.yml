name: Desktop App

on:
  push:
    branches: [main, 'feat/**']
    paths: ['desktop/**', 'ui/**']
  pull_request:
    paths: ['desktop/**', 'ui/**']
  # release trigger removed — desktop app is on hold (see PR #41 for context)

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: desktop/go.mod
          cache-dependency-path: desktop/go.sum

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: desktop/frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install shared UI dependencies
        working-directory: ui
        run: npm ci --legacy-peer-deps

      - name: Install frontend dependencies
        working-directory: desktop/frontend
        run: npm install --legacy-peer-deps

      - name: Build
        working-directory: desktop
        run: wails build -tags webkit2_41

      - name: Test Go
        working-directory: desktop
        run: go test ./...

      - name: Test UI
        working-directory: ui
        run: npx vitest run

